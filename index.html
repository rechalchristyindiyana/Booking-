<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Sea Zoe Beach Homes</title>
    <style>
        :root {
            --primary: #0f4c4a;
            --accent: #e07a5f;
            --accent-hover: #f4a261;
            --text-dark: #1d3557;
            --card-bg: #ffffff;
            --bg-gradient: linear-gradient(135deg, #072e2d 0%, #0f4c4a 40%, #2a9d8f 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-dark);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            max-width: 410px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            max-width: 90px;
            height: auto;
            display: block;
            margin: 0 auto 12px auto;
            object-fit: contain;
        }

        .header h1 {
            font-size: 28px;
            margin: 5px 0;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 12px;
            color: var(--accent);
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .welcome-text {
            font-size: 14px;
            line-height: 1.6;
            color: #4f6361;
            text-align: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="date"], select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e9e9;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f9fbfb;
            color: var(--text-dark);
            font-family: inherit;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(15, 76, 74, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 6px 15px rgba(224, 122, 95, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: #d0694e;
            box-shadow: 0 8px 20px rgba(224, 122, 95, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .quick-links {
            margin-top: 30px;
            padding-top: 22px;
            border-top: 2px dashed #e5e9e9;
        }

        .quick-links h3 {
            font-size: 11px;
            margin: 0 0 14px 0;
            color: #8fa3a1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-align: center;
        }

        .link-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            background-color: #f0f6f6;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .link-item span {
            margin-right: 12px;
            font-size: 18px;
        }

        .link-item:hover {
            background-color: #ffffff;
            border-color: rgba(42, 157, 143, 0.3);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <img src="https://files.catbox.moe/xrnemy.png" alt="Sea Zoe Logo" class="brand-logo">
        <h1>Sea Zoe Beach Homes</h1>
        <p>Staycation Escape</p>
    </div>

    <p class="welcome-text">
        Thank you for reaching out! We would love to host your next staycation escape at Ramapuram Beach. Choose your dates below to check availability instantly.
    </p>

    <form id="bookingForm">
        <div class="form-group">
            <label for="checkin">📅 Check-in Date</label>
            <input type="date" id="checkin" required>
        </div>

        <div class="form-group">
            <label for="checkout">📅 Check-out Date</label>
            <input type="date" id="checkout" required>
        </div>

        <div class="form-group">
            <label for="guests">👥 Number of Guests</label>
            <select id="guests" required>
                <option value="1">1 Guest</option>
                <option value="2">2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
                <option value="5">5 Guests</option>
                <option value="6+">6+ Guests</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Check Availability</button>
    </form>

    <div class="quick-links">
        <h3>📍 Quick Links & Info</h3>
        <a href="https://files.catbox.moe/in4x0x.png" target="_blank" class="link-item">
            <span>📋</span> Sea Zoe Brochure (Rates & Amenities)
        </a>
        <a href="https://maps.app.goo.gl/uPDe7oLjNEi8UJxF7?g_st=ac" target="_blank" class="link-item">
            <span>📍</span> Location & Directions
        </a>
    </div>
</div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('checkin').min = today;
    document.getElementById('checkout').min = today;

    document.getElementById('checkin').addEventListener('change', function() {
        document.getElementById('checkout').min = this.value;
    });

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const checkin = document.getElementById('checkin').value;
        const checkout = document.getElementById('checkout').value;
        const guests = document.getElementById('guests').value;

        const message = `Hii, Sea Zoe Beach Homes Staycation! I'd like to check availability for a staycation:\n\n📅 Check-in: ${checkin}\n📅 Check-out: ${checkout}\n👥 Guests: ${guests}`;
        
        const encodedMessage = encodeURIComponent(message);
        const whatsappNumber = "919490675816"; 
        
        window.location.href = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
    });
</script>

</body>
</html>
