<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Sea Zoe Beach Homes</title>
    <style>
        :root {
            --primary: #1e5e5c;
            --secondary: #d4a373;
            --background: #ffffff;
            --text: #1a2e2b;
            --light-bg: #f4ece1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--background);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(26, 46, 43, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(212, 163, 115, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            margin: 10px 0 5px 0;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--secondary);
            margin: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .welcome-text {
            font-size: 14.5px;
            line-height: 1.6;
            color: #4a5554;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        input[type="date"], select {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
            color: var(--text);
            font-family: inherit;
        }

        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(30, 94, 92, 0.2);
        }

        .btn-submit:hover {
            background-color: #164745;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .quick-links {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .quick-links h3 {
            font-size: 12px;
            margin: 0 0 14px 0;
            color: #8c9b98;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .link-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14.5px;
            padding: 10px;
            border-radius: 8px;
            background-color: #f8fafc;
            transition: background 0.2s;
        }

        .link-item span {
            margin-right: 12px;
            font-size: 16px;
        }

        .link-item:hover {
            background-color: #f1f5f9;
            color: #164745;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span style="font-size: 45px;">🌊🏡</span>
        <h1>Sea Zoe Beach Homes</h1>
        <p>Staycation Escape</p>
    </div>

    <p class="welcome-text">
        Thank you for reaching out! We would love to host your next staycation. Please select your preferred dates and guest count below to check availability.
    </p>

    <form id="bookingForm">
        <div class="form-group">
            <label for="checkin">📅 Check-in Date</label>
            <input type="date" id="checkin" required>
        </div>

        <div class="form-group">
            <label for="checkout">📅 Check-out Date</label>
            <input type="date" id="checkout" required>
        </div>

        <div class="form-group">
            <label for="guests">👥 Number of Guests</label>
            <select id="guests" required>
                <option value="1">1 Guest</option>
                <option value="2">2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
                <option value="5">5 Guests</option>
                <option value="6+">6+ Guests</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Check Availability</button>
    </form>

    <div class="quick-links">
        <h3>📍 Quick Links & Info</h3>
        <a href="https://www.instagram.com/seazoebeachhomes" target="_blank" class="link-item">
            <span>📋</span> View Our Rates & Amenities
        </a>
        <a href="https://maps.app.goo.gl/uPDe7oLjNEi8UJxF7?g_st=ac" target="_blank" class="link-item">
            <span>📍</span> Location & Directions
        </a>
    </div>
</div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('checkin').min = today;
    document.getElementById('checkout').min = today;

    document.getElementById('checkin').addEventListener('change', function() {
        document.getElementById('checkout').min = this.value;
    });

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const checkin = document.getElementById('checkin').value;
        const checkout = document.getElementById('checkout').value;
        const guests = document.getElementById('guests').value;

        const message = `Hii, Sea Zoe Beach Homes Staycation! I'd like to check availability for a staycation:\n\n📅 Check-in: ${checkin}\n📅 Check-out: ${checkout}\n👥 Guests: ${guests}`;
        
        const encodedMessage = encodeURIComponent(message);
        const whatsappNumber = "919490675816"; 
        
        window.location.href = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
    });
</script>

</body>
</html>
